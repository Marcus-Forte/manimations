[project]
name = "Manimations"
version = "0.1.0"
description = "This repository holds animations made with [Manim](https://github.com/ManimCommunity/manim) to illustrate software concepts."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "black>=25.12.0",
    "manim>=0.19.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]
